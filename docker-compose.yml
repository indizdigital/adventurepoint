name: adventurepoint

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SMTP_HOST', 'mailpit');
        define('SMTP_PORT', 1025);
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/adventurepoint:/var/www/html/wp-content/themes/adventurepoint
      - ./wp-content/plugins/ap-reservations:/var/www/html/wp-content/plugins/ap-reservations
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins

  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/adventurepoint:/var/www/html/wp-content/themes/adventurepoint
      - ./wp-content/plugins/ap-reservations:/var/www/html/wp-content/plugins/ap-reservations
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./bin:/scripts:ro
    profiles: ["cli"]

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  db_data:
  wp_core:
